<html>
<head>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        h2 {
            margin: 0.5rem 0;
        }

        label {
            margin: 0.5rem 0;
        }

        #container {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            margin: 2rem;
        }

        #lists-container {
            display: flex;
            flex-direction: column;
            width: 30vw;
        }

        #voyages-container {
            display: flex;
            flex-direction: column;
            overflow-y: scroll;
            height: calc(40vh - 8rem);
        }

        #places-container {
            display: flex;
            flex-direction: column;
            overflow-y: scroll;
            height: calc(60vh - 8rem);
        }

        #geo-container {
            position: relative;
            display: block;
            width: 40vw;
        }

        #map {
            display: block;
            width: 100%;
        }

        #popover {
            position: absolute;
            margin: 0.5em;
            padding: 0.5em;
            background-color: lightgray;
            border-radius: 0.5em;
        }

        .card {
            border: 1px solid grey;
            border-radius: 1rem;
            padding: 0.8rem;
            margin: 0.5rem;
            cursor: pointer;
        }

        .card.active {
            background-color: lightgray;
        }

        .label {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .alt-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .alt-label {
            font-size: 0.8rem;
            padding: 0.2rem 0.4rem;
            border-radius: 0.4rem;
            background: lightblue;
        }
    </style>
</head>
<body>
<div id="container">
    <div id="lists-container">
        <label>
            <input type="checkbox" id="voyages-style">
            Enable curved voyages (basic shipping paths)
        </label>

        <div id="voyages">
            <h2>Voyages</h2>
            <div id="voyages-container"></div>
        </div>

        <div id="places">
            <h2>Places</h2>
            <div id="places-container"></div>
        </div>
    </div>

    <div id="geo-container">
        <canvas id="map"></canvas>
        <div id="popover" style="display: none;"></div>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
